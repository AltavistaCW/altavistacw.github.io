<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1E293B">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="iconos/icono-192.png">
  <link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Alta Vista">
  <title>Precios y estado de tu auto</title>
  <meta name="description" content="Servicios, precios y estado de tu auto.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="header">
    <div class="contenedor">
      <a class="marca" href="index.html">
        <svg class="icono" aria-hidden="true"><use href="#i-gota"></use></svg>
        <span data-negocio="nombre">Lavado</span>
      </a>
      <a class="btn btn-claro btn-sm" href="index.html">
        <svg class="icono" aria-hidden="true"><use href="#i-volver"></use></svg> Inicio
      </a>
    </div>
  </header>

  <main>
    <!-- Estado -->
    <section class="seccion" id="estado" aria-labelledby="titulo-estado">
      <div class="contenedor">
        <h1 id="titulo-estado" style="font-size:clamp(1.6rem,5vw,2.2rem)">¿Cómo va mi auto?</h1>
        <form class="tarjeta" id="form-estado" style="max-width:560px">
          <div class="campo">
            <label for="f-buscar-patente">Patente</label>
            <input type="text" id="f-buscar-patente" autocapitalize="characters" maxlength="8" placeholder="KJTR34" required>
            <span class="ayuda">La misma que escribiste al reservar.</span>
          </div>
          <button type="submit" class="btn btn-primario">
            <svg class="icono" aria-hidden="true"><use href="#i-buscar"></use></svg> Consultar
          </button>
          <div id="resultado-estado" aria-live="polite" style="margin-top:16px"></div>
        </form>
      </div>
    </section>

    <!-- Contacto: lo que necesita alguien que ya tiene su hora (llamar, escribir, llegar) -->
    <section class="seccion" aria-labelledby="titulo-contacto" style="padding-top:0">
      <div class="contenedor">
        <div class="tarjeta contacto-local" style="max-width:560px">
          <h2 id="titulo-contacto" style="font-size:1.25rem">¿Necesitas algo?</h2>
          <p class="estado-hoy" id="horario-hoy"></p>
          <div class="grilla">
            <a class="btn btn-secundario btn-bloque" id="c-llamar" href="#">
              <svg class="icono" aria-hidden="true"><use href="#i-telefono"></use></svg> Llamar al local
            </a>
            <a class="btn btn-secundario btn-bloque" id="c-whatsapp" href="#" target="_blank" rel="noopener">
              <svg class="icono" aria-hidden="true"><use href="#i-mensaje"></use></svg> Escribir por WhatsApp
            </a>
            <a class="btn btn-secundario btn-bloque" id="c-mapa" href="#" target="_blank" rel="noopener">
              <svg class="icono" aria-hidden="true"><use href="#i-ubicacion"></use></svg> Cómo llegar
            </a>
          </div>
          <p class="texto-2" style="margin:12px 0 0"><span data-negocio="direccion"></span> · <span data-negocio="horario"></span></p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="contenedor"><span data-negocio="nombre"></span></div>
  </footer>

  <script src="js/pwa.js"></script>
  <script src="js/iconos.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/almacen.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cliente.js"></script>
</body>
</html>
